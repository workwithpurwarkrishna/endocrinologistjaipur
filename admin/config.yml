backend:
  name: git-gateway
  branch: main

media_folder: "src/assets/images"
public_folder: "/assets/images"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Diabetes"
          - "Thyroid"
          - "PCOS"
          - "Obesity"
          - "Hormones"
          - "Lifestyle"
          - "Paediatric Endocrinology"
          - "General Health"
      - { label: "Cover Image", name: "cover", widget: "image", required: false }
      - { label: "Summary (used for SEO & card previews)", name: "summary", widget: "text", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
      - label: "Tags"
        name: "tags"
        widget: "list"
        default: ["post"]
        required: false
